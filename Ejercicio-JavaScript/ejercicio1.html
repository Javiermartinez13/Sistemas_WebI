<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de contraseñas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="tarjeta">
        <h1>Generador de contraseñas</h1>
        <p class="descripcion">
            Crea una contraseña formada por palabras aleatorias de un diccionario.
            Puedes elegir algunas opciones para personalizarla.
        </p>

        <form id="form">
            <label for="numero">Número de palabras</label>
            <input type="number" id="numero" value="3">

            <label class="opcion">
                <input type="checkbox" id="mayuscula">
                Poner la primera letra en mayúscula
            </label>

            <label class="opcion">
                <input type="checkbox" id="unicas">
                No repetir palabras
            </label>

            <button type="submit">Generar contraseña</button>
        </form>

        <p id="mensaje" class="mensaje" aria-live="polite"></p>
        <output id="resultado" class="resultado" aria-live="polite">Aquí aparecerá la contraseña</output>
    </main>

    <script src="script.js"></script>
</body>
</html>
